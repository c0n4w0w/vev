<!doctype html>
<!--
  TING sign-in email — Supabase Auth's magic-link and signup-confirmation
  template. GoTrue renders and sends this itself, so it is plain HTML with
  two Supabase template variables: ConfirmationURL, used once, in the
  button — the secure, single-use sign-in link; never build that link by
  hand here — and SiteURL, for the absolute address of the logo. (GoTrue
  expands template syntax inside comments too, which is why this note does
  not spell them out.)

  The logo is the official TING lockup (logo system v2, spruce PNG export,
  public/brand/ting-horizontal-spruce-976.png) at 170 × 46 px — the same
  file, size and placement as the approval email (EMAIL_LOGO).

  Account-level, not community-level: no community name or branding, and
  Norwegian, TING's default language. The logo is the only place the body
  says TING; the subject ("Logg inn på TING") names it for the inbox.

  Palette, type and layout match the approval email (lib/email/invitation.ts,
  EMAIL_STYLE). `npm run check:auth-email` fails if the two drift apart.
  Tables and inline styles only, for mail clients; Outlook gets a fixed-width
  wrapper because it ignores max-width.
-->
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Logg inn på TING</title>
</head>
<body style="margin:0;padding:0;background:#f6f4ef;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f6f4ef" style="background:#f6f4ef;">
    <tr><td align="center" style="padding:32px 16px;">
      <!--[if mso]><table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="max-width:520px;background:#ffffff;border:1px solid #e4e0d7;border-radius:6px;border-collapse:separate;">
        <tr><td bgcolor="#1f4a3d" style="height:4px;line-height:4px;font-size:4px;background:#1f4a3d;border-radius:6px 6px 0 0;">&nbsp;</td></tr>
        <tr><td style="padding:28px 28px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#17191a;">
          <img src="{{ .SiteURL }}/brand/ting-horizontal-spruce-976.png" width="170" height="46" alt="TING" style="display:block;width:170px;height:auto;max-width:100%;border:0;outline:none;text-decoration:none;margin:0 0 18px -3px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;font-weight:600;color:#1f4a3d;">
          <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:600;color:#17191a;">Logg inn</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4c5153;">Bruk knappen nedenfor for å fortsette.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
            <tr><td bgcolor="#1f4a3d" style="background:#1f4a3d;border-radius:5px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:5px;">Logg inn →</a>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:16px 28px 24px;border-top:1px solid #e4e0d7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
          <p style="margin:0 0 8px;font-size:12px;line-height:1.6;color:#797e81;">Lenken er personlig og kan bare brukes én gang.</p>
          <p style="margin:0;font-size:12px;line-height:1.6;color:#797e81;">Har du ikke bedt om dette? Se bort fra denne e-posten.</p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
